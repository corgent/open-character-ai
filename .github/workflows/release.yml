name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto derives from Conventional Commits)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

# Dummy build-time environment (see ci.yml).
env:
  DATABASE_URL: "******localhost:5432/ci"
  DIRECT_URL: "******localhost:5432/ci"
  NEXTAUTH_SECRET: "ci_dummy_nextauth_secret"
  NEXTAUTH_URL: "http://localhost:3000"
  GOOGLE_CLIENT_ID: "ci_dummy_google_client_id"
  GOOGLE_CLIENT_SECRET: "ci_dummy_google_client_secret"
  STRIPE_SECRET_KEY: "sk_test_ci_dummy"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_dummy"
  STRIPE_WEBHOOK_SECRET: "whsec_ci_dummy"
  MU_API_KEY: "ci_dummy_muapi_key"
  WEBHOOK_URL: "http://localhost:3000"
  NEXT_PUBLIC_THEME: "midnight"

jobs:
  ci-gate:
    name: Verify (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  version:
    name: Bump version & tag
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute semver bump
        id: bump
        env:
          MANUAL_BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          # Avoid release loops: if HEAD is already a release commit, do nothing.
          if git log -1 --pretty=%s | grep -qE '^chore\(release\): v[0-9]'; then
            echo "HEAD is already a release commit — skipping."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p "require('./package.json').version")
          echo "Current version: $current"

          # Commits since the last semver tag (or full history if none).
          last_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi
          echo "Commit range: $range (last tag: ${last_tag:-none})"

          if [ "$MANUAL_BUMP" != "auto" ]; then
            bump="$MANUAL_BUMP"
          else
            bump="patch"
            if git log "$range" --pretty=%B | grep -qE 'BREAKING[ -]CHANGE|^[a-zA-Z]+(\(.+\))?!:'; then
              bump="major"
            elif git log "$range" --pretty=%s | grep -qE '^feat(\(.+\))?:'; then
              bump="minor"
            fi
          fi
          echo "Bump: $bump"

          new_version=$(npx semver --increment "$bump" "$current" 2>/dev/null || true)
          if [ -z "$new_version" ]; then
            # Fallback semver increment without the semver package.
            IFS='.' read -r major minor patch <<< "$current"
            case "$bump" in
              major) new_version="$((major+1)).0.0" ;;
              minor) new_version="${major}.$((minor+1)).0" ;;
              *)     new_version="${major}.${minor}.$((patch+1))" ;;
            esac
          fi
          echo "New version: $new_version"

          npm version "$new_version" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore(release): v${new_version}"
          git tag -a "v${new_version}" -m "Release v${new_version}"
          git push origin main --follow-tags

          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.bumped == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        env:
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          set -euo pipefail
          last_tag=$(git tag -l 'v*' --sort=-v:refname | grep -v "^v${NEW_VERSION}$" | head -n1 || true)
          if [ -n "$last_tag" ]; then
            range="${last_tag}..v${NEW_VERSION}"
          else
            range="v${NEW_VERSION}"
          fi

          {
            echo "## What's Changed"
            echo ""
            feats=$(git log "$range" --pretty='- %s (%h)' --grep='^feat' || true)
            fixes=$(git log "$range" --pretty='- %s (%h)' --grep='^fix' || true)
            others=$(git log "$range" --pretty='- %s (%h)' --grep='^feat' --grep='^fix' --invert-grep || true)
            if [ -n "$feats" ]; then echo "### Features"; echo "$feats"; echo ""; fi
            if [ -n "$fixes" ]; then echo "### Fixes"; echo "$fixes"; echo ""; fi
            if [ -n "$others" ]; then echo "### Other Changes"; echo "$others"; echo ""; fi
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${last_tag:-v${NEW_VERSION}}...v${NEW_VERSION}"
          } > changelog.md
          cat changelog.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          # Pre-1.0 releases are marked as prerelease.
          prerelease_flag=""
          major="${NEW_VERSION%%.*}"
          if [ "$major" = "0" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file changelog.md \
            $prerelease_flag

  release-smoke:
    name: Verify tagged release boots
    runs-on: ubuntu-latest
    needs: [version, github-release]
    if: needs.version.outputs.bumped == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.new_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 60000
      - name: Run smoke tests against the tagged release
        run: npm run test:smoke
